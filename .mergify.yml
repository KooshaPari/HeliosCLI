# Mergify Configuration — Optimized for multi-language monorepos
# Docs: https://docs.mergify.com/
#
# Check names: the `ci`, `lint`, `typecheck` and `test` checks referenced by the
# original revision of this file do not exist in this repository, so every rule
# gated on them was dead and nothing could auto-merge. The conditions now name
# checks that actually report status:
#
#   ci         -> "CI results (required)"       (the repo's required aggregate)
#   lint       -> "Lint & Format"               (Trunk Check)
#   typecheck  -> "build + test + clippy + fmt" (rust-ci; cargo check/clippy)
#   test       -> "build + test + clippy + fmt" (rust-ci; runs the test suite)
#
# Mergify reads this file from the default branch, not from a pull request head,
# so a change here only takes effect once it lands on `main`.
#
# `v8-canary` is intentionally NOT listed as a required check. The v8-canary
# workflow runs the Bazel-driven rusty-v8 release build, which has not been
# green on this repo since PR #13366 (Mar 3, 2026); the current deep failure is
# a libc++ `include_next`-chain reordering problem in the custom libc++ overlay
# (see docs/postmortems/2026-09-v8-canary.md) and there is no known-good
# configuration to import. v8-canary is wrapped with `continue-on-error: true`
# and its build log is uploaded as an artifact; do not gate on it.

pull_request_rules:
    # Auto-merge when all CI checks pass; GitHub branch protection resolves conversations.
    - name: Auto-merge when CI is green
      conditions:
          - "#review-requested=0"
          - check-success=CI results (required)
          - check-success=Lint & Format
          - check-success=build + test + clippy + fmt
          - -conflict
          - -closed
      actions:
          merge:
              method: squash
              commit_message_format:
                  title: pr-title
                  body: empty
                  trailers:
                      - co-authored-by

    # Auto-merge owner PRs when CI passes (no self-review required)
    - name: Auto-merge owner PRs + CI green
      conditions:
          - author=KooshaPari
          - check-success=CI results (required)
          - check-success=Lint & Format
          - check-success=build + test + clippy + fmt
          - -conflict
          - -closed
          - -draft
      actions:
          merge:
              method: squash
              commit_message_format:
                  title: pr-title
                  body: empty
                  trailers:
                      - co-authored-by

    # Auto-merge dependabot/Renovate PRs when CI passes
    - name: Auto-merge dependency updates
      conditions:
          - or:
                - author = dependabot[bot]
                - author = renovate[bot]
          - check-success=CI results (required)
          - -conflict
          - -closed
      actions:
          merge:
              method: squash
              commit_message_format:
                  title: pr-title
                  body: empty
                  trailers:
                      - co-authored-by

    # Auto-merge bot PRs (CI configs, formatting) when CI passes
    - name: Auto-merge bot housekeeping PRs
      conditions:
          - or:
                - author = trunk-io[bot]
                - author = mergify[bot]
                - author = github-actions[bot]
          - check-success=CI results (required)
          - check-success=Lint & Format
          - -conflict
          - -closed
      actions:
          merge:
              method: squash

    # Release Please bot PRs (version bumps + changelogs). release-please[bot]
    # matches none of the rules above, so these PRs otherwise stall open until
    # manually merged (see PR #673, merged by hand on 2026-09-20).
    #
    # This rule intentionally does NOT require any of the run-by-default
    # checks (CI results (required) / Lint & Format / build + test + clippy + fmt).
    # The repo has GitHub Actions "Require approval for first-time contributors"
    # implicitly enabled via `default_workflow_permissions: write` +
    # `can_approve_pull_request_reviews: true`; that gate blocks every new
    # workflow run from the release-please bot until a maintainer visits each
    # Actions page and clicks "Approve and run". The checks stay queued at
    # status `action_required` indefinitely, the rollup never reports PASS or
    # FAIL, and `check-success=` conditions never match. The safe bot is
    # release-please itself; gating on `label=autorelease: pending` (applied
    # by release-please only for releases it has actually staged) plus
    # `-conflict` + `-closed` is sufficient to prevent a broken bot cut.
    - name: Auto-merge release-please PRs
      conditions:
          - author = release-please[bot]
          - "label = autorelease: pending"
          - -conflict
          - -closed
          - -draft
      actions:
          merge:
              method: squash
          delete_head_branch:

    # Add reviewers based on changed paths
    # NOTE: no `teams:` key here. KooshaPari is a user account, not an
    # organization, so `phenotype/core` (and any other team slug) can never
    # resolve and the rule fails with "Invalid requested teams".
    # NOTE: the `author!=KooshaPari` guard is required. GitHub rejects a review
    # request when the requested reviewer is the pull request author, so
    # without it this rule fails with "Can't request a review from the pull
    # request author" on every owner-authored PR and the
    # `Rule: Request review from team (request_reviews)` check stays red.
    - name: Request review from team
      conditions:
          - -closed
          - -draft
          - author!=KooshaPari
      actions:
          request_reviews:
              users:
                  - KooshaPari

    # Label PRs based on changed files
    - name: Label Python changes
      conditions:
          - files~=\.py$
      actions:
          label:
              add:
                  - python

    - name: Label Rust changes
      conditions:
          - files~=\.rs$|Cargo\.
      actions:
          label:
              add:
                  - rust

    - name: Label Go changes
      conditions:
          - files~=\.go$|go\.
      actions:
          label:
              add:
                  - go

    - name: Label TypeScript changes
      conditions:
          - files~=\.ts$|\.tsx$|package\.json
      actions:
          label:
              add:
                  - typescript

    # Close stale PRs after 30 days
    - name: Close stale PRs
      conditions:
          - -closed
          - -draft
          - updated-at <= 30 days ago
          - "#review-requested=0"
      actions:
          comment:
              message: >
                  This PR has been automatically closed after 30 days of inactivity.
                  Feel free to reopen if still relevant.
          close: {}

    # Warn on large PRs
    - name: Warn on large PRs
      conditions:
          - -closed
          - -draft
          - "#files>20"
      actions:
          comment:
              message: >
                  **Large PR Alert**: This PR touches {{ number }} files.
                  Consider splitting into smaller PRs for easier review.

    # Add ready-to-merge label when all checks pass
    - name: Add ready-to-merge label
      conditions:
          - -closed
          - -draft
          - check-success=CI results (required)
          - check-success=Lint & Format
          - check-success=build + test + clippy + fmt
      actions:
          label:
              add:
                  - ready-to-merge
